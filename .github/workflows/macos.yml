name: macOS CI

# Work in progress. Lives in its own file, triggered from its own branch, until
# it is green -- then it folds into ci.yml as a second job. main stays clean
# meanwhile.
#
# Everything here is built with Homebrew GCC rather than Apple Clang; see the
# header of conan-profiles/CI-CD/MacOS-ARM64_profile.txt for why.

on:
  push:
    branches: [ macos-ci ]
  workflow_dispatch:

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Conan Center has no macOS binaries for a GCC profile, so every dependency
    # compiles here. Generous ceiling until a real run says what this costs.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 (GCC 13)
            os: macos-15
            profile: MacOS-ARM64_profile.txt
          - name: macOS x86_64 (GCC 13)
            os: macos-15-intel
            profile: MacOS-AMD64_profile.txt

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build prerequisites
        run: |
          # The runner images already ship Homebrew GCC 13 through 16 with
          # matching gfortran, so this is normally a no-op. Guard rather than
          # install unconditionally: `brew install gcc` is slow when it decides
          # to upgrade.
          if ! command -v g++-13 >/dev/null || ! command -v gfortran-13 >/dev/null; then
            brew install gcc@13
          fi
          # /usr/bin/make on macOS is GNU make 3.81, under which Chombo's
          # `%_F.H: %.ChF` rule never fires and ChomboFortran's generated headers
          # silently never appear. Homebrew's make installs as gmake, which
          # cmake/BuildChomboLibs.cmake looks for ahead of make.
          brew install make
          brew install conan
          gmake --version | head -1
          conan --version

      - name: Verify the toolchain matches the Conan profile
        run: |
          expected=$(sed -n 's/^compiler\.version=//p' conan-profiles/CI-CD/${{ matrix.profile }})
          for tool in gcc-13 g++-13 gfortran-13; do
            actual=$("$tool" -dumpversion | cut -d. -f1)
            echo "$tool: $actual  ($(command -v $tool))"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$tool is version $actual but ${{ matrix.profile }} pins compiler.version=$expected"
              exit 1
            fi
          done
          # Chombo reduces $(CXX) to a compiler name it matches its GNU rules
          # against. If this stops resolving to plain g++, Chombo silently falls
          # back to defaults and drops the -C that protects Fortran's // operator.
          {
            printf 'CXX := %s\n' "$(command -v g++-13)"
            printf 'cxxname = $(notdir $(firstword $(subst -, ,$(CXX))))\n'
            printf 'check:\n'
            printf '\t@test "$(cxxname)" = "g++" || { echo "cxxname=$(cxxname), expected g++"; exit 1; }\n'
            printf '\t@echo "  Chombo resolves $(CXX) to cxxname=$(cxxname)"\n'
          } > /tmp/cxxname.mk
          make -f /tmp/cxxname.mk check

      - name: Install dependencies with Conan
        env:
          CC: gcc-13
          CXX: g++-13
          FC: gfortran-13
        run: |
          # Messaging is off for now. It pulls libcurl and openssl, which are the
          # two longest source builds and the likeliest to break under GCC on
          # macOS; that is a second step once the base build is proven. Keep this
          # in sync with OPTION_TARGET_MESSAGING below.
          conan install . --build=missing \
            -pr:a=conan-profiles/CI-CD/${{ matrix.profile }} \
            -o include_messaging=False

      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
          FC: gfortran-13
        run: |
          source build/generators/conanbuild.sh
          cmake -B build -S . -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/build/generators/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPTION_TARGET_MESSAGING=OFF

      - name: Build
        env:
          CC: gcc-13
          CXX: g++-13
          FC: gfortran-13
        run: |
          source build/generators/conanbuild.sh
          cmake --build build

      - name: Test
        run: |
          source build/generators/conanbuild.sh
          ctest --test-dir build --output-on-failure

      - name: Upload solver binaries
        uses: actions/upload-artifact@v4
        with:
          name: vcell-chombo-${{ matrix.os }}
          path: |
            build/bin/VCellChombo2D_x64
            build/bin/VCellChombo3D_x64
          if-no-files-found: error
          retention-days: 14
