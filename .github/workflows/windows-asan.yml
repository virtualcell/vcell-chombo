name: Windows ASan

# Diagnostic, not a gate. Run on demand to find out where the Windows solver
# corrupts the heap.
#
# The Windows build is complete and the solver runs -- usage and analytic pass
# in both dimensions -- but smoke and regression die with exit code 0xc0000374,
# STATUS_HEAP_CORRUPTION. The point of death moves between runs with no
# relevant change: one run stopped in ChomboScheduler::generateMembraneIndexData
# and the next got as far as initStencils. That is the signature of heap
# corruption rather than a deterministic fault -- the damage happens at one
# point and the allocator notices at the next unlucky allocation.
#
# Chasing that through ordinary CI is sampling where the allocator happened to
# look, not finding the bug. AddressSanitizer reports the offending write and
# the allocation it belongs to, which is the actual question.
#
# Only the C++ compiled by CMake is instrumented -- the solver and the
# submodules. Chombo's archives are left alone, which keeps this to two flags
# and no new plumbing: ASan supports partial instrumentation, and its
# interceptors cover every heap operation in the process regardless of which
# object file made the call. If the report points into Chombo rather than at
# our own code, the next step is instrumenting Chombo's make as well.
#
# Fortran is not instrumented. flang's ASan support is less travelled, and the
# allocations here are all made from the C++ side.

# Triggered on pushes to the bring-up branch as well as by hand. Dispatch alone
# would be preferable -- this duplicates every expensive step of windows.yml --
# but GitHub resolves workflow_dispatch against the default branch, so a
# dispatch-only workflow that exists only on a feature branch cannot be run at
# all. Once the Windows work merges, the push trigger can go.
on:
  workflow_dispatch:
  push:
    branches: [ windows/clang-cl-build ]

concurrency:
  group: windows-asan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan:
    name: Windows x86_64 ASan (2D smoke)
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM (clang-cl, clang, flang)
        shell: pwsh
        run: |
          # Pinned to match conan-profiles/CI-CD/Windows-AMD64_profile.txt; see
          # the note in windows.yml. llvm-symbolizer comes from here too, which
          # is what turns ASan's addresses into file and line numbers.
          choco install llvm --version=22.1.8 -y --no-progress --allow-downgrade
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\LLVM\bin"

      - name: Set up MSYS2 for make, perl and a shell with pipefail
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          install: >-
            make
            perl
            diffutils

      - name: Hand CMake the MSYS2 tool paths
        shell: pwsh
        run: |
          $msys = "${{ steps.msys2.outputs.msys2-location }}" -replace '\\','/'
          foreach ($t in @("make", "perl", "bash")) {
            Add-Content -Path $env:GITHUB_ENV -Value ("CHOMBO_" + $t.ToUpper() + "=$msys/usr/bin/$t.exe")
          }
          Add-Content -Path $env:GITHUB_ENV -Value "MSYS2_USR_BIN=$msys/usr/bin"

      - name: Install Conan
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan>=2.0"

      - name: Install dependencies with Conan
        shell: pwsh
        run: |
          conan install . --build=missing -pr:a=conan-profiles/CI-CD/Windows-AMD64_profile.txt

      - name: Locate the ASan runtime libraries
        shell: pwsh
        run: |
          # CMake drives the link with lld-link directly, not through the
          # clang-cl driver, and -fsanitize=address is a driver flag -- the
          # driver is what adds the runtime. Passing it to the raw linker gets
          # "ignoring unknown argument" followed by undefined __asan_init.
          #
          # So the libraries are found and passed explicitly. Globbed rather
          # than hardcoded because the path carries the LLVM major version
          # (lib/clang/22/lib/windows), which the pin in this file will outlive.
          $dir = Get-ChildItem "C:\Program Files\LLVM\lib\clang\*\lib\windows" -Directory |
                 Select-Object -First 1
          if (-not $dir) { throw "no LLVM clang_rt lib directory under C:\Program Files\LLVM\lib\clang" }
          Write-Host "  runtime directory: $($dir.FullName)"

          # LLVM 22 ships no static ASan runtime on Windows at all. The
          # directory holds only:
          #
          #   clang_rt.asan_dynamic-x86_64.{lib,dll}
          #   clang_rt.asan_static_runtime_thunk-x86_64.lib
          #   clang_rt.asan_dynamic_runtime_thunk-x86_64.lib
          #
          # ASan on Windows is a DLL runtime, and which thunk you link depends
          # on your CRT rather than on the sanitizer: static_runtime_thunk for
          # /MT, dynamic_runtime_thunk for /MD. This build is /MT, so it takes
          # the import library and the static thunk, and the DLL has to be
          # findable at run time -- see the test step.
          $want = @("clang_rt.asan_dynamic-x86_64.lib",
                    "clang_rt.asan_static_runtime_thunk-x86_64.lib")
          $libs = @()
          foreach ($n in $want) {
            $f = Join-Path $dir.FullName $n
            if (Test-Path $f) { $libs += $n; Write-Host "  found $n" }
            else { Write-Host "::warning::$n not present in $($dir.FullName)" }
          }
          if ($libs.Count -eq 0) {
            Get-ChildItem $dir.FullName -Filter "clang_rt.asan*" | ForEach-Object { Write-Host "    candidate: $($_.Name)" }
            throw "none of the expected ASan libraries were found; see the candidates above"
          }
          $flags = "/libpath:`"$($dir.FullName)`" " + ($libs -join " ")
          Add-Content -Path $env:GITHUB_ENV -Value "ASAN_LINK_FLAGS=$flags"
          Add-Content -Path $env:GITHUB_ENV -Value "ASAN_RUNTIME_DIR=$($dir.FullName)"
          Write-Host "  linker flags: $flags"

      - name: Configure with AddressSanitizer
        shell: pwsh
        run: |
          . .\build\generators\conanbuild.ps1
          # Through the CXXFLAGS and LDFLAGS environment variables, not
          # -DCMAKE_CXX_FLAGS. A -D on the command line *replaces* the flags
          # CMake computes for the platform, and that silently dropped /EHsc:
          #
          #   error: cannot use 'throw' with exceptions disabled
          #
          # CMake initialises CMAKE_CXX_FLAGS from its own platform defaults
          # plus CXXFLAGS, so the environment variable adds rather than
          # overrides. Writing out the MSVC default set by hand instead
          # (/DWIN32 /D_WINDOWS /W3 /GR /EHsc) would work until CMake changed it.
          #
          # -fsanitize=address instruments the code; the runtime libraries come
          # from the step above, because CMake links with lld-link rather than
          # the clang driver, which would otherwise translate the flag itself.
          # /Z7 puts debug info in the object files -- without it the report is
          # addresses rather than source lines.
          # _DISABLE_STRING_ANNOTATION and _DISABLE_VECTOR_ANNOTATION are
          # required by the partial instrumentation this job uses on purpose.
          # MSVC's STL annotates std::string and std::vector buffers when ASan
          # is on, and emits a /failifmismatch directive so that mixing
          # annotated and unannotated objects is caught at link:
          #
          #   lld-link: error: /failifmismatch: mismatch detected for
          #   'annotate_string'
          #
          # The solver is instrumented; Chombo's archives and the Conan
          # dependencies are not. Turning the annotations off makes both sides
          # agree, which is MSVC's documented answer for exactly this mix.
          #
          # The cost is container-overflow detection inside a std::vector's own
          # buffer. Overflows past the end of the allocation are still caught,
          # and the fault being chased is heap-level corruption, so that is the
          # right trade here -- instrumenting Chombo as well would restore it.
          $env:CXXFLAGS = "-fsanitize=address /Z7 -D_DISABLE_STRING_ANNOTATION=1 -D_DISABLE_VECTOR_ANNOTATION=1"
          $env:LDFLAGS = "$env:ASAN_LINK_FLAGS"
          #
          # The dependencies and Chombo stay uninstrumented, which is fine --
          # see the note at the top of this file.
          # CMAKE_TRY_COMPILE_CONFIGURATION is not optional here. CMake's
          # compiler check does not inherit CMAKE_BUILD_TYPE, so it compiled its
          # test program with Debug flags -- /Od /RTC1 and, fatally, -MTd -- and
          # clang-cl refuses:
          #
          #   invalid argument '-MTd' not allowed with '-fsanitize=address'
          #   AddressSanitizer doesn't support linking with debug runtime
          #   libraries yet
          #
          # The real build was always going to be fine: with CMAKE_BUILD_TYPE
          # Release, Conan's MultiThreaded$<$<CONFIG:Debug>:Debug> resolves to
          # plain /MT, which ASan does support. Only the try-compile was Debug.
          cmake -B build -S . -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$PWD/build/generators/conan_toolchain.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TRY_COMPILE_CONFIGURATION=Release `
            -DCMAKE_Fortran_COMPILER="flang" `
            -DCHOMBO_CH_CPP="clang -E -P -C -x c" `
            -DCHOMBO_MAKE_PROGRAM="$env:CHOMBO_MAKE" `
            -DCHOMBO_PERL_PROGRAM="$env:CHOMBO_PERL" `
            -DCHOMBO_BASH_PROGRAM="$env:CHOMBO_BASH" `
            -DOPTION_TARGET_MESSAGING=OFF `
            -DOPTION_TARGET_CHOMBO3D_SOLVER=OFF

      - name: Disarm MSYS2's link.exe
        shell: pwsh
        run: |
          # See windows.yml. MSYS2's usr/bin goes on PATH for the build because
          # Chombo's makefiles want GNU find, chmod, cp, sort and uniq, and its
          # coreutils link.exe would otherwise shadow MSVC's linker.
          $l = "$env:MSYS2_USR_BIN/link.exe"
          if (Test-Path $l) { Move-Item $l "$l.disabled" -Force }

      - name: Build the 2D solver only
        shell: pwsh
        run: |
          # 2D alone: it reproduces the fault and halves the build. Chombo's 3D
          # libraries are not configured in this job at all.
          $env:PATH = "$env:MSYS2_USR_BIN;$env:PATH"
          cmake --build build --target VCellChombo2D_x64

      - name: Run the smoke test under ASan
        shell: pwsh
        continue-on-error: true
        run: |
          # The job is informational, so a failure here is the point rather than
          # a problem -- continue-on-error keeps the report readable as a
          # successful run rather than a red X with the answer buried in it.
          #
          # detect_leaks is off because ASan does not implement leak detection
          # on Windows; asking for it only produces a warning. abort_on_error=0
          # so the report is printed in full before the process goes away.
          # clang_rt.asan_dynamic-x86_64.dll lives beside the import library,
          # and nothing else puts that directory on PATH -- without this the
          # solver fails to start with a missing-DLL error rather than running.
          $env:PATH = "$env:ASAN_RUNTIME_DIR;$env:PATH"
          $env:ASAN_OPTIONS = "detect_leaks=0:abort_on_error=0:print_summary=1:symbolize=1"
          $env:ASAN_SYMBOLIZER_PATH = "C:\Program Files\LLVM\bin\llvm-symbolizer.exe"
          ctest --test-dir build -R VCellChombo2D_x64_smoke --output-on-failure

      - name: Report
        shell: pwsh
        run: |
          Write-Host "The ASan output is in the step above. What to look for:"
          Write-Host "  * the first line names the fault -- heap-buffer-overflow,"
          Write-Host "    heap-use-after-free, double-free or similar"
          Write-Host "  * the first stack is the offending access"
          Write-Host "  * the second names the allocation it belongs to"
          Write-Host ""
          Write-Host "If the stacks are addresses rather than source lines, llvm-symbolizer"
          Write-Host "was not found; if ASan reports nothing at all and the run still dies"
          Write-Host "with 0xc0000374, the corrupting write is in Chombo rather than in the"
          Write-Host "instrumented code, and Chombo's make needs -fsanitize=address too."
