name: Windows CI

# Work in progress, in its own file and on its own branch until green, then it
# folds into ci.yml as a fourth job.
#
# Separate for a practical reason too: GitHub serves a run's logs only once
# every job in it has finished, so pairing an experimental platform with healthy
# ones means waiting on the healthy ones just to read the failure.
#
# Built with clang-cl and flang, following vcell-fvsolver. MSVC cannot do this
# alone -- no Fortran compiler -- and MinGW was tried first and rejected for the
# eventual pybind11 wheel, since CPython's Windows builds are MSVC/UCRT. See
# conan-profiles/CI-CD/Windows-AMD64_profile.txt.
#
# MSYS2 is here as a build tool, not a toolchain: ChomboFortran is perl, and
# chombo/lib/mk needs GNU make and a shell with pipefail whoever compiles. The
# three programs it supplies are handed to CMake by absolute path through
# BuildChomboLibs.cmake's own cache variables, rather than by putting
# msys64/usr/bin on PATH. That is deliberate -- MSYS2's /usr/bin shadows
# find.exe, sort.exe and others that the runner and MSBuild rely on, and the
# resulting breakage is far from the cause.

on:
  push:
    branches: [ windows/clang-cl-build ]
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x86_64 (clang-cl + flang)
    runs-on: windows-latest
    # Conan Center has no binaries for a Windows + clang profile, so the whole
    # dependency tree compiles here, as it does on macOS.
    timeout-minutes: 180

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up the MSVC environment
        # clang-cl compiles against the MSVC headers and links with its
        # libraries, so INCLUDE, LIB and the linker have to be on the
        # environment before anything is configured.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM (clang-cl, clang, flang)
        shell: pwsh
        run: |
          # Pinned, not `choco upgrade llvm`, which takes whatever is latest --
          # it installed LLVM 22 on the first attempt and the toolchain check
          # below caught the mismatch against the profile.
          #
          # 21.1.8 specifically, because that is the flang the parity run used:
          # the claim that flang reproduces the stored regression baselines bit
          # for bit was measured with flang-21 (21.1.8) from apt.llvm.org, and
          # pinning here keeps the compiler the Windows binaries are built with
          # the same one that claim covers. Bumping this should mean re-running
          # the flang parity workflow, not just the version number.
          #
          # --allow-downgrade because the runner image ships a newer LLVM
          # already; without it choco declines to go backwards.
          choco install llvm --version=21.1.8 -y --no-progress --allow-downgrade
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$llvm\flang.exe")) { throw "flang.exe not in $llvm" }
          Add-Content -Path $env:GITHUB_PATH -Value $llvm
          & "$llvm\clang-cl.exe" --version
          & "$llvm\flang.exe" --version

      - name: Set up MSYS2 for make, perl and a shell with pipefail
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          # The MSYS environment rather than MINGW64: nothing here compiles, so
          # a MinGW toolchain would only be a larger install and a second set of
          # compilers on disk to confuse things. It also suppresses the
          # MINGW64-is-deprecated warning the earlier attempt collected.
          msystem: MSYS
          update: false
          install: >-
            make
            perl
            diffutils

      - name: Hand CMake the MSYS2 tool paths
        shell: pwsh
        run: |
          # Absolute paths, rather than PATH. See the note at the top of this file.
          $msys = "${{ steps.msys2.outputs.msys2-location }}" -replace '\\','/'
          foreach ($t in @("make", "perl", "bash")) {
            $p = "$msys/usr/bin/$t.exe"
            if (-not (Test-Path $p)) { throw "$t not found at $p" }
            Add-Content -Path $env:GITHUB_ENV -Value ("CHOMBO_" + $t.ToUpper() + "=" + $p)
          }
          Add-Content -Path $env:GITHUB_ENV -Value "MSYS2_USR_BIN=$msys/usr/bin"

      - name: Verify the toolchain the profile expects
        shell: pwsh
        run: |
          $expected = (Select-String -Path conan-profiles/CI-CD/Windows-AMD64_profile.txt `
                        -Pattern '^compiler\.version=(\d+)').Matches[0].Groups[1].Value
          $actual = (& clang-cl --version | Select-String -Pattern 'version (\d+)').Matches[0].Groups[1].Value
          Write-Host "  clang-cl: $actual  (profile expects $expected)"
          if ($actual -ne $expected) {
            Write-Host "::error::clang-cl is version $actual but Windows-AMD64_profile.txt pins compiler.version=$expected. The LLVM version is pinned in the install step above; change both together, and re-run the flang parity workflow if the Fortran compiler moved."
            exit 1
          }
          # Chombo needs GNU make 4+, and BuildChomboLibs.cmake refuses older.
          & $env:CHOMBO_MAKE --version | Select-Object -First 1
          & $env:CHOMBO_PERL --version | Select-String 'This is perl'

      - name: Does Chombo recognise this system?
        shell: pwsh
        run: |
          # An unrecognised uname is not diagnosed by Chombo: it falls through to
          # an "Older Crays" branch that sets CXX=CC and ranlib=touch and then
          # fails somewhere unrelated. The MSYS shell reports MSYS_NT-..., which
          # chombo/lib/mk/Make.defs now folds onto CYGWIN -- and that is also
          # what yields -DCH_CYGWIN, which SimTool keys its path separator off.
          $sys = & $env:CHOMBO_BASH -lc 'uname'
          Write-Host "  uname reports: $sys"
          if ($sys -notmatch '^(MSYS|MINGW|CYGWIN)') {
            Write-Host "::error::uname reports '$sys', which Make.defs does not map to CYGWIN"
            exit 1
          }

      - name: Install Conan
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan>=2.0"
          conan --version

      - name: Install dependencies with Conan
        shell: pwsh
        run: |
          conan install . --build=missing -pr:a=conan-profiles/CI-CD/Windows-AMD64_profile.txt

      - name: Configure
        shell: pwsh
        run: |
          . .\build\generators\conanbuild.ps1
          # CHOMBO_CH_CPP uses the plain clang driver rather than clang-cl, and
          # that distinction matters. This pass preprocesses ChomboFortran's
          # output as C text, with GNU-style flags; clang-cl is MSVC-flag-
          # compatible and does not take -E -P -C -x c in that form. -x c is
          # what stops clang treating AMRTools/CFLeastSquares.F as Fortran and
          # handing it to a Fortran compiler -- see BuildChomboLibs.cmake.
          #
          # Conan has no Fortran setting, so flang is named here rather than
          # coming from the profile's [buildenv].
          cmake -B build -S . -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$PWD/build/generators/conan_toolchain.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_Fortran_COMPILER="flang" `
            -DCHOMBO_CH_CPP="clang -E -P -C -x c" `
            -DCHOMBO_MAKE_PROGRAM="$env:CHOMBO_MAKE" `
            -DCHOMBO_PERL_PROGRAM="$env:CHOMBO_PERL" `
            -DCHOMBO_BASH_PROGRAM="$env:CHOMBO_BASH" `
            -DOPTION_TARGET_MESSAGING=OFF

      - name: Confirm the toolchain CMake actually picked
        shell: pwsh
        run: |
          # Same guard as the flang parity job, for the same reason: a silent
          # fallback to another compiler would produce a green run proving
          # nothing.
          Select-String -Path build/CMakeCache.txt -Pattern '^CMAKE_(CXX|Fortran)_COMPILER:'
          $cache = Get-Content build/CMakeCache.txt -Raw
          if ($cache -notmatch 'CMAKE_Fortran_COMPILER:[A-Z]*=.*flang') {
            Write-Host "::error::Fortran compiler is not flang"; exit 1
          }
          if ($cache -notmatch 'CMAKE_CXX_COMPILER:[A-Z]*=.*clang') {
            Write-Host "::error::C++ compiler is not clang-cl"; exit 1
          }

      - name: Build
        shell: pwsh
        run: cmake --build build

      - name: Test
        shell: pwsh
        run: ctest --test-dir build --output-on-failure

      - name: Upload solver binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vcell-chombo-windows-x86_64
          path: |
            build/bin/VCellChombo2D_x64.exe
            build/bin/VCellChombo3D_x64.exe
          if-no-files-found: error
          retention-days: 14
